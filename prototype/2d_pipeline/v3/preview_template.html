<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>主角 · 像素横斩动作预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0e1420;color:#e4e6eb;font:16px system-ui,sans-serif}main{max-width:1100px;margin:32px auto;padding:0 24px}header{display:flex;align-items:end;justify-content:space-between;gap:24px}h1{font-size:28px;margin:0 0 10px}p{color:#a9b4c5;line-height:1.6;margin:8px 0 18px}.badge{color:#edc18c;white-space:nowrap}canvas{display:block;width:100%;height:auto;image-rendering:pixelated;background:#18212f;border:1px solid #354159;border-radius:8px}nav{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}button,select{background:#263448;color:#e4e6eb;border:1px solid #53647c;padding:10px 16px;border-radius:6px;font:inherit;cursor:pointer}button:hover{background:#394e6b}button.active{border-color:#efac6a;color:#ffd4a7}input[type=range]{width:100%;accent-color:#eaba7e}output{display:block;color:#edc18c;margin:10px 0}footer{font-size:13px;color:#92a2b9;margin:24px 0;line-height:1.8}a{color:#edc18c}.small{font-size:13px}
</style>
<main><header><div><h1>主角 · 完整横斩</h1><p>待机 → 蓄力 → 挥出 → 命中 → 收势 → 待机</p></div><p class="badge" id="summary"></p></header>
<canvas id="stage" width="768" height="576" aria-label="主角横斩动画"></canvas>
<nav><button id="attack">播放完整动作</button><button id="pause">暂停</button><button id="previous">上一帧</button><button id="next">下一帧</button><button id="loop">循环：关</button><select id="speed" aria-label="播放速度"><option value="0.5">半速 0.5×</option><option value="1" selected>正常 1×</option><option value="1.5">快速 1.5×</option></select><button id="weapon" class="active">武器：开</button><button id="fx" class="active">特效：开</button></nav>
<label for="scrub">横斩逐帧查看</label><input id="scrub" type="range" min="0" max="11" value="0"><output id="status" aria-live="off">载入图片中…</output>
<footer>方向键逐帧，空格重播。可以单独隐藏剑与挥砍特效，检查身体和握持动作。<br>模型为带骨架的 2.5D 分层贴图；原始游戏帧为 256×192 透明 PNG。此页面可离线双击打开。<br><a href="2026-09-26-横斩逐帧检查图.png">查看逐帧总图</a> · <a href="2026-09-26-主角完整横斩.gif">查看动画 GIF</a></footer></main>
<script>
const manifest=__MANIFEST__,sources=__IMAGES__,images={},canvas=document.querySelector('#stage'),ctx=canvas.getContext('2d');
let clip='idle',index=0,elapsed=0,playing=true,loop=false,speed=1,weapon=true,fx=true,last=0;
document.querySelector('#summary').textContent=`${manifest.clips.slash.frames.length} 帧 / ${manifest.clips.slash.frames.reduce((sum,f)=>sum+f.duration_ms,0)} 毫秒`;
document.querySelector('#scrub').max=manifest.clips.slash.frames.length-1;
function frame(){return manifest.clips[clip].frames[index]}
function draw(){ctx.imageSmoothingEnabled=false;ctx.fillStyle='#18212f';ctx.fillRect(0,0,768,576);ctx.strokeStyle='#3c4a60';ctx.beginPath();ctx.moveTo(12,manifest.root_px[1]*3+.5);ctx.lineTo(756,manifest.root_px[1]*3+.5);ctx.stroke();for(const layer of manifest.layers){if((layer==='weapon'&&!weapon)||(layer==='fx'&&!fx))continue;ctx.drawImage(images[frame().paths[layer]],0,0,768,576)}document.querySelector('#status').textContent=`${clip==='slash'?'横斩':'待机'} · 第 ${index+1}/${manifest.clips[clip].frames.length} 帧 · 停留 ${frame().duration_ms} 毫秒 · ${speed}×${playing?'':' · 已暂停'}`;if(clip==='slash')document.querySelector('#scrub').value=index}
function attack(){clip='slash';index=0;elapsed=0;playing=true;draw()}
function step(delta){playing=false;if(clip!=='slash'){clip='slash';index=0}else{const count=manifest.clips.slash.frames.length;index=(index+delta+count)%count}elapsed=0;draw()}
function animate(now){const delta=last?Math.min(now-last,100):0;last=now;if(playing){elapsed+=delta*speed;while(elapsed>=frame().duration_ms){elapsed-=frame().duration_ms;index++;if(index>=manifest.clips[clip].frames.length){if(clip==='slash'&&!loop)clip='idle';index=0}}draw()}requestAnimationFrame(animate)}
document.querySelector('#attack').onclick=attack;
document.querySelector('#pause').onclick=()=>{playing=!playing;draw()};
document.querySelector('#previous').onclick=()=>step(-1);document.querySelector('#next').onclick=()=>step(1);
document.querySelector('#scrub').oninput=e=>{clip='slash';index=Number(e.target.value);elapsed=0;playing=false;draw()};
document.querySelector('#loop').onclick=e=>{loop=!loop;e.target.textContent=`循环：${loop?'开':'关'}`;e.target.classList.toggle('active',loop);if(loop)attack();draw()};
document.querySelector('#speed').onchange=e=>{speed=Number(e.target.value);draw()};
document.querySelector('#weapon').onclick=e=>{weapon=!weapon;e.target.textContent=`武器：${weapon?'开':'关'}`;e.target.classList.toggle('active',weapon);draw()};
document.querySelector('#fx').onclick=e=>{fx=!fx;e.target.textContent=`特效：${fx?'开':'关'}`;e.target.classList.toggle('active',fx);draw()};
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;if(e.code==='Space'){e.preventDefault();attack()}if(e.code==='ArrowRight')step(1);if(e.code==='ArrowLeft')step(-1)});
Promise.all(Object.entries(sources).map(([path,src])=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>{images[path]=im;resolve()};im.onerror=reject;im.src=src}))).then(()=>{draw();requestAnimationFrame(animate)}).catch(()=>document.querySelector('#status').textContent='图片加载失败，请重新生成预览文件。');
</script></html>
